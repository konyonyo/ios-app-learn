name: MinimalApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MinimalApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/MinimalApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.minimalapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: true
